flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/animations/
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Yekan
      fonts:
        - asset: assets/fonts/Yekan.ttf
    - family: Comic
      fonts:
        - asset: assets/fonts/comicbd.ttf
    - family: Negaar
      fonts:
          - asset: assets/fonts/ANegaar.ttf
    - family: Vazir
      fonts:
          - asset: assets/fonts/Vazir.ttf
    - family: Lalezar
      fonts:
          - asset: assets/fonts/Lalezar.ttf
    - family: BNazanin
      fonts:
          - asset: assets/fonts/BNazanin.ttf
    - family: BYekan
      fonts:
          - asset: assets/fonts/BYekan.ttf
    - family: Baguede-Regular
      fonts:
          - asset: assets/fonts/Baguede-Regular.otf
    - family: Sahel
      fonts:
          - asset: assets/fonts/Sahel.ttf
    - family: Nazanin
      fonts:
        - asset: assets/fonts/nazanin.ttf
    - family: Calibri
      fonts:
        - asset: assets/fonts/calibri.ttf
    - family: Neue_MD
      fonts:
        - asset: assets/fonts/helvetica_neue_medium.ttf
    - family: Iransans_Fa_Bold
      fonts:
        - asset: assets/fonts/iransans_fa_number_bold.ttf
    - family: Iransans_Fa_MD
      fonts:
        - asset: assets/fonts/iransans_fa_number_medium.ttf
    #       - asset: fonts/Schyler-Italic.ttf
    #         style: italic
    - family: Arial
      fonts:
        - asset: assets/fonts/arial.ttf
